[project]
name = "backend"
version = "0.1.0"
description = "AI-powered DevOps agent for monitoring, diagnosing, and investigating Linux VPS infrastructure through a secure LangGraph-based tool system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]



[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
